  position:absolute;inset:0;z-index:20;
  width:100%;height:100%;max-width:none;max-height:none;
  border:0;margin:0;padding:0;
  background:rgba(5,5,3,.992);
  color:#F4EBCF;
  overflow:hidden;
}
#permission::backdrop{background:#050503}
#permitField{position:absolute;inset:0;pointer-events:none}
#permitWords{
  position:absolute;
  left:8vw;right:8vw;
  bottom:calc(env(safe-area-inset-bottom,0px) + 9vh);
  font-family:"Courier New",ui-monospace,Menlo,monospace;
  text-align:center;
  color:#F4EBCF;
}
#permitWords p{
  margin:0 auto 24px;max-width:31em;
  font-size:12px;line-height:1.65;letter-spacing:.055em;
  opacity:.78;
}
#choices{
  display:flex;justify-content:center;gap:28px;
}
#choices button{
  appearance:none;border:0;background:transparent;
  color:#F5C400;
  font:11px/1 "Courier New",ui-monospace,Menlo,monospace;
  letter-spacing:.20em;
  padding:16px 10px;
}
#choices button:active{opacity:.45}
.sr-only{
  position:absolute!important;width:1px;height:1px;
  padding:0;margin:-1px;overflow:hidden;
  clip:rect(0,0,0,0);white-space:nowrap;border:0;
}

@media (min-width:720px){
  body{background:#111}
  #app{
    width:390px;height:844px;min-height:0;
    box-shadow:0 0 0 10px #151311,0 26px 80px #000;
  }
}
</style>
</head>

<body>
<div id="app">
  <canvas id="field" aria-label="Ambient recent-time field"></canvas>

  <dialog id="permission">
    <canvas id="permitField" aria-hidden="true"></canvas>
    <div id="permitWords">
      <p>This room can hold the last fifteen seconds. Nothing leaves this device unless you keep it.</p>
      <div id="choices">
        <button id="listen" type="button">LISTEN</button>
        <button id="watch" type="button">WATCH ONLY</button>
      </div>
    </div>
  </dialog>

  <div id="status" class="sr-only" role="status" aria-live="polite"></div>
</div>

<script>
(() => {
"use strict";

/* ============================================================
   AMBIENT PRESENT
   One field. No visible controls after permission.

   LIVE
     tap                recent past comes forward
     horizontal swipe   browse kept moments

   RECALLED
     long press          keep this moment
     tap                 return to live
     swipe down          let this recalled moment go

   ARCHIVE
     horizontal swipe    older / newer kept moment
     swipe up            share / send
     double tap          copy transcript when one exists
     swipe down          delete kept moment
     tap                 return to live

   Every visible mark corresponds to temporal or stored state.
   No timer rings, progress meters, transport icons, badges,
   cards, tabs, status labels, or app chrome.
============================================================ */

const WINDOW_MS = 15000;
const GRID = Math.max(8, Math.min(128, Number(new URLSearchParams(location.search).get("grid")) || 64));
const SAMPLE_MS = GRID <= 16 ? 420 : GRID <= 32 ? 250 : 170;
const LONG_MS = 650;
const SWIPE = GRID * .12;

const field = document.getElementById("field");
const g = field.getContext("2d",{alpha:false});
const permit = document.getElementById("permission");
const permitField = document.getElementById("permitField");
const pg = permitField.getContext("2d",{alpha:false});
const status = document.getElementById("status");

const C = {
  bg:[5,5,3],
  dim:[63,48,28],
  amber:[224,146,49],
  gold:[245,196,0],
  cream:[244,235,207],
  red:[192,80,28]
};

const rgb=(c,a=1)=>`rgba(${c[0]},${c[1]},${c[2]},${a})`;
const mix=(a,b,t)=>[
  a[0]+(b[0]-a[0])*t,
  a[1]+(b[1]-a[1])*t,
  a[2]+(b[2]-a[2])*t
];

const S = {
  mode:"permission",       // permission | live | recall | archive | share | copy | delete | fault | synthetic
  stream:null, ac:null, analyser:null, data:null,
  ring:null, head:0, filled:0, sampleRate:48000, processor:null,
  activity:0, smooth:0,
  marks:[],
  selected:null,
  words:[],
  recognizer:null,
  recognizerWanted:false,
  lastSample:0,
  phase:0,
  pointer:null,
  tapAt:0,
  archive:[],
  archiveIndex:0,
  wake:null,
  synthetic:false,
  transitionAt:performance.now(),
  transient:null
};

function announce(s){ status.textContent=s }

/* ---------------------- raster ---------------------- */
function sizeCanvas(c,ctx){
  const dpr=Math.min(devicePixelRatio||1,2);
  c.width=GRID*dpr;c.height=GRID*dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.imageSmoothingEnabled=false;
}
function resize(){sizeCanvas(field,g);sizeCanvas(permitField,pg)}
resize();addEventListener("resize",resize);

function clear(ctx){ctx.fillStyle=rgb(C.bg);ctx.fillRect(0,0,GRID,GRID)}
function px(ctx,x,y,c,a=1,s=1){
  if(a<=0)return;
  ctx.fillStyle=rgb(c,a);
  ctx.fillRect(Math.round(x),Math.round(y),Math.max(1,Math.round(s)),Math.max(1,Math.round(s)));
}

/* ---------------------- IndexedDB ---------------------- */
const DB = {
  db:null,
  async open(){
    if(this.db)return this.db;
    return new Promise((resolve,reject)=>{
      const r=indexedDB.open("ambient-present",1);
      r.onupgradeneeded=()=>{
        const db=r.result;
        if(!db.objectStoreNames.contains("notes")) db.createObjectStore("notes",{keyPath:"id"});
      };
      r.onsuccess=()=>{this.db=r.result;resolve(this.db)};
      r.onerror=()=>reject(r.error);
    });
  },
  async put(note){
    const db=await this.open();
    return new Promise((resolve,reject)=>{
      const tx=db.transaction("notes","readwrite");
      tx.objectStore("notes").put(note);
      tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);
    });
  },
  async all(){
    const db=await this.open();
    return new Promise((resolve,reject)=>{
      const r=db.transaction("notes","readonly").objectStore("notes").getAll();
      r.onsuccess=()=>resolve((r.result||[]).sort((a,b)=>b.ts-a.ts));
      r.onerror=()=>reject(r.error);
    });
  },
  async del(id){
    const db=await this.open();
    return new Promise((resolve,reject)=>{
      const tx=db.transaction("notes","readwrite");
      tx.objectStore("notes").delete(id);
      tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);
    });
  }
};

/* ---------------------- permission ---------------------- */
function legacyMic(constraints){
  const fn=navigator.getUserMedia||navigator.webkitGetUserMedia||navigator.mozGetUserMedia;
  if(!fn)return Promise.reject(new Error("unsupported"));
  return new Promise((resolve,reject)=>fn.call(navigator,constraints,resolve,reject));
}
function getMic(){
  if(navigator.mediaDevices?.getUserMedia){
    return navigator.mediaDevices.getUserMedia({
      audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}
    });
  }
  return legacyMic({audio:true});
}

async function ensureAudio(){
  if(S.ac)return;
  const AC=window.AudioContext||window.webkitAudioContext;
  if(!AC)throw new Error("no audio context");
  S.ac=new AC();
  try{await S.ac.resume()}catch(_){}
  S.sampleRate=S.ac.sampleRate;
}

async function beginListening(){
  try{
    await ensureAudio();
    const stream=await getMic();
    S.stream=stream;

    const src=S.ac.createMediaStreamSource(stream);
    const analyser=S.ac.createAnalyser();
    analyser.fftSize=256;
    analyser.smoothingTimeConstant=.86;
    src.connect(analyser);

    S.analyser=analyser;
    S.data=new Uint8Array(analyser.frequencyBinCount);

    // bounded PCM ring: never persisted until explicit keep
    S.ring=new Float32Array(Math.floor(S.sampleRate*WINDOW_MS/1000));
    S.head=0;S.filled=0;

    const Proc=S.ac.createScriptProcessor ? S.ac.createScriptProcessor(2048,1,1) : null;
    if(Proc){
      Proc.onaudioprocess=e=>{
        const d=e.inputBuffer.getChannelData(0);
        let sum=0;
        for(let i=0;i<d.length;i++){
          const v=d[i];
          S.ring[S.head]=v;
          S.head=(S.head+1)%S.ring.length;
          S.filled=Math.min(S.ring.length,S.filled+1);
          sum+=v*v;
        }
        S.activity=Math.min(1,Math.sqrt(sum/d.length)*9);
      };
      const mute=S.ac.createGain();mute.gain.value=0;
      src.connect(Proc);Proc.connect(mute);mute.connect(S.ac.destination);
      S.processor=Proc;
    }

    S.mode="live";
    S.synthetic=false;
    S.transitionAt=performance.now();
    startRecognition();
    requestWakeLock();
    closePermission();
    announce("Listening.");
  }catch(err){
    S.mode="fault";
    S.transitionAt=performance.now();
    announce("Microphone access unavailable. Choose watch only or change site microphone permission.");
    if(navigator.vibrate)navigator.vibrate([15,60,15]);
  }
}

async function beginSynthetic(){
  try{await ensureAudio()}catch(_){}
  S.synthetic=true;
  S.mode="live";
  S.transitionAt=performance.now();
  closePermission();
  announce("Watch-only simulation.");
}

document.getElementById("listen").addEventListener("click",beginListening);
document.getElementById("watch").addEventListener("click",beginSynthetic);
try{permit.showModal()}catch(_){permit.setAttribute("open","")}

function closePermission(){
  try{permit.close()}catch(_){permit.removeAttribute("open")}
}

/* Permission animation uses the same grammar as the live field. */
function drawPermission(t){
  clear(pg);
  const cx=GRID*.5,cy=GRID*.42;
  const k=(Math.sin(t*.0012)+1)*.5;
  const n=GRID<=16?7:13;

  for(let i=0;i<n;i++){
    const a=i/n*Math.PI*2;
    const r=GRID*.10 + (i%3)*GRID*.018;
    const q=.80+.08*Math.sin(t*.0007+i*1.7);
    px(pg,cx+Math.cos(a)*r*q,cy+Math.sin(a)*r*.75*q,C.amber,.18+k*.08,1);
  }
  px(pg,cx,cy,C.gold,.58+k*.18,GRID<=16?1:2);
}

/* ---------------------- microphone + semantics ---------------------- */
function updateActivity(){
  if(S.synthetic){
    const t=performance.now();
    const phrase=(Math.sin(t/1250)+Math.sin(t/417)*.32+1.25)/2.57;
    S.activity=Math.max(0,phrase-.28)*1.35;
  }else if(S.analyser && !S.processor){
    S.analyser.getByteFrequencyData(S.data);
    let sum=0,n=Math.min(44,S.data.length);
    for(let i=2;i<n;i++)sum+=S.data[i];
    S.activity=sum/n/255;
  }
  S.smooth+=(S.activity-S.smooth)*.065;
}

function startRecognition(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR)return;
  try{
    const r=new SR();
    r.continuous=true;r.interimResults=true;r.lang="en-US";
    S.recognizer=r;S.recognizerWanted=true;

    r.onresult=e=>{
      const now=Date.now();
      for(let i=e.resultIndex;i<e.results.length;i++){
        const res=e.results[i],text=res[0].transcript.trim();
        if(!text)continue;
        S.words=S.words.filter(w=>!w.interim);
        S.words.push({t:now,text,interim:!res.isFinal});
      }
    };
    r.onend=()=>{
      if(S.recognizerWanted&&S.stream){
        setTimeout(()=>{try{r.start()}catch(_){}},250);
      }
    };
    r.start();
  }catch(_){}
}

/* ---------------------- temporal cells ---------------------- */
function deposit(now){
  const speaking=Math.max(0,Math.min(1,(S.smooth-.025)/.20));
  const coherence=.16+speaking*.80;

  S.marks.push({
    born:now,
    speaking,
    coherence,
    a:S.phase+(Math.random()-.5)*(1.9-coherence*1.55),
    r:GRID*(.11+Math.random()*(.25-coherence*.09)),
    seed:Math.random()
  });
  S.lastSample=now;
}

function prune(now){
  S.marks=S.marks.filter(m=>now-m.born<=WINDOW_MS);
  S.words=S.words.filter(w=>now-w.t<=WINDOW_MS+5000);
}

function markPos(m,now,mode=S.mode){
  const age=Math.max(0,Math.min(1,(now-m.born)/WINDOW_MS));
  const cx=GRID*.5,cy=GRID*.47;

  let a=m.a+age*.18;
  let r=m.r+age*GRID*.075;
  let x=cx+Math.cos(a)*r-age*GRID*.115;
  let y=cy+Math.sin(a)*r*.76;

  if(mode==="recall"){
    x+=(1-age)*GRID*.055;
  }
  return{x,y,age};
}

function drawLive(now){
  clear(g);
  const cx=GRID*.5,cy=GRID*.47;

  for(const m of S.marks){
    const p=markPos(m,now,"live");
    const life=Math.pow(1-p.age,.63);
    let col=mix(C.dim,C.amber,1-p.age);
    col=mix(col,C.cream,m.speaking*.70);

    const a=life*(.16+m.speaking*.80);
    const s=(GRID>=48&&m.speaking>.62)?2:1;
    px(g,p.x,p.y,col,a,s);

    // Heard speech creates agreement, not frenzy.
    if(m.speaking>.36 && p.age<.72){
      const q=.10+m.speaking*.22;
      px(g,p.x+(cx-p.x)*q,p.y+(cy-p.y)*q,C.cream,a*.42,1);
    }
  }

  // One datum for the immediate present.
  px(g,cx,cy,C.cream,.36+S.smooth*.62,S.smooth>.16&&GRID>=32?2:1);

  // Kept moments are visible as distant, stable neighbors.
  if(S.archive.length){
    const max=Math.min(3,S.archive.length);
    for(let i=0;i<max;i++){
      const note=S.archive[i];
      const side=i%2?1:-1;
      const x=cx+side*(GRID*.34 + Math.floor(i/2)*GRID*.04);
      const y=cy+((i%3)-1)*GRID*.11;
      drawMini(note,x,y,GRID*.055,.22-(i*.04));
    }
  }
}

function drawRecall(now){
  clear(g);
  const cx=GRID*.5,cy=GRID*.47;

  for(const m of S.marks){
    const p=markPos(m,now,"recall");
    const life=Math.pow(1-p.age,.55);
    let col=mix(C.dim,C.gold,1-p.age);
    col=mix(col,C.cream,.18+m.speaking*.55);
    px(g,p.x,p.y,col,life*(.28+m.speaking*.66),m.speaking>.55&&GRID>=48?2:1);
  }

  // The recent past comes forward as a data-derived skin.
  const recent=S.marks.filter(m=>now-m.born<WINDOW_MS*.48);
  for(let i=0;i<recent.length;i+=Math.max(1,Math.floor(recent.length/36))){
    const p=markPos(recent[i],now,"recall");
    px(g,p.x+GRID*.045,p.y,C.cream,.62,1);
  }

  // long press feedback: selected form slowly settles rather than showing progress
  if(S.pointer){
    const held=(performance.now()-S.pointer.t0)/LONG_MS;
    if(held>0){
      const settle=Math.min(1,held);
      for(let i=0;i<8;i++){
        const a=i/8*Math.PI*2;
        const r=GRID*(.23-.025*settle);
        px(g,cx+Math.cos(a)*r,cy+Math.sin(a)*r*.75,C.amber,.06+.08*settle,1);
      }
    }
  }
}

function drawMini(note,cx,cy,r,alpha=.35){
  const pts=note?.shape||[];
  if(!pts.length){px(g,cx,cy,C.amber,alpha,1);return}
  const step=Math.max(1,Math.floor(pts.length/28));
  for(let i=0;i<pts.length;i+=step){
    const p=pts[i];
    px(g,cx+(p.x-.5)*r*2,cy+(p.y-.5)*r*2,mix(C.amber,C.cream,p.v||.3),alpha,1);
  }
}

function drawArchive(t){
  clear(g);
  if(!S.archive.length){S.mode="live";return}

  const cx=GRID*.5,cy=GRID*.47;
  const note=S.archive[S.archiveIndex];
  const ageDays=Math.min(1,(Date.now()-note.ts)/(1000*60*60*24*30));

  // central held object
  const pts=note.shape||[];
  for(const p of pts){
    const x=cx+(p.x-.5)*GRID*.48;
    const y=cy+(p.y-.5)*GRID*.38;
    const col=mix(C.amber,C.cream,p.v||.25);
    px(g,x,y,col,.58+(p.v||.2)*.3,GRID>=64&&p.v>.7?2:1);
  }

  // stability = persistence
  const pulse=.5+.5*Math.sin(t*.00045);
  for(let a=0;a<Math.PI*2;a+=GRID<=16?.65:.18){
    px(g,cx+Math.cos(a)*GRID*.27,cy+Math.sin(a)*GRID*.20,C.amber,.10+.035*pulse,1);
  }

  // previous / next are spatially present, never tabs
  if(S.archiveIndex>0) drawMini(S.archive[S.archiveIndex-1],GRID*.84,cy,GRID*.075,.28);
  if(S.archiveIndex<S.archive.length-1) drawMini(S.archive[S.archiveIndex+1],GRID*.16,cy,GRID*.075,.20);

  if(S.mode==="share"){
    const k=Math.min(1,(performance.now()-S.transitionAt)/550);
    // the held object lifts toward the device boundary
    const yOff=-k*GRID*.30;
    for(const p of pts){
      px(g,cx+(p.x-.5)*GRID*.48,cy+(p.y-.5)*GRID*.38+yOff,C.cream,(1-k)*.4,1);
    }
  }

  if(S.mode==="copy"){
    const k=Math.min(1,(performance.now()-S.transitionAt)/600);
    for(const p of pts){
      const x=cx+(p.x-.5)*GRID*.48;
      const y=cy+(p.y-.5)*GRID*.38;
      px(g,x+GRID*.18*k,y,C.cream,(1-k)*.35,1);
    }
  }

  if(S.mode==="delete"){
    const k=Math.min(1,(performance.now()-S.transitionAt)/800);
    for(let i=0;i<pts.length;i+=2){
      const p=pts[i];
      const x=cx+(p.x-.5)*GRID*.48 + Math.sin(i)*k*GRID*.06;
      const y=cy+(p.y-.5)*GRID*.38 + k*GRID*.22;
      px(g,x,y,C.red,(1-k)*.42,1);
    }
  }

  // older notes fade by age only; the geometry stays stable
  if(ageDays>.75){
    for(let i=0;i<6;i++){
      px(g,cx-GRID*.20+i*GRID*.08,cy+GRID*.28,C.dim,.12,1);
    }
  }
}

function drawFault(t){
  clear(g);
  const cx=GRID*.5,cy=GRID*.47;
  for(let i=0;i<14;i++){
    const a=i/14*Math.PI*2;
    const split=Math.cos(a)>0?GRID*.05:-GRID*.05;
    px(g,cx+Math.cos(a)*GRID*.16+split,cy+Math.sin(a)*GRID*.11,C.red,.22,1);
  }
}

/* ---------------------- selected moment ---------------------- */
function snapshotAudio(){
  if(!S.ring||!S.filled)return null;
  const out=new Float32Array(S.filled);
  const start=(S.head-S.filled+S.ring.length)%S.ring.length;
  for(let i=0;i<S.filled;i++)out[i]=S.ring[(start+i)%S.ring.length];
  return out;
}

function selectedText(){
  const now=Date.now();
  return S.words.filter(w=>now-w.t<=WINDOW_MS).map(w=>w.text).join(" ").trim();
}

function snapshotShape(now){
  const pts=[];
  const marks=S.marks.slice(-Math.min(320,S.marks.length));
  if(!marks.length)return pts;
  for(const m of marks){
    const p=markPos(m,now,"recall");
    pts.push({
      x:Math.max(0,Math.min(1,p.x/GRID)),
      y:Math.max(0,Math.min(1,p.y/GRID)),
      v:m.speaking
    });
  }
  return pts;
}

function pcmToWav(samples,rate){
  if(!samples||!samples.length)return null;
  const ab=new ArrayBuffer(44+samples.length*2);
  const v=new DataView(ab);
  const w=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i))};
  w(0,"RIFF");v.setUint32(4,36+samples.length*2,true);w(8,"WAVE");
  w(12,"fmt ");v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);
  v.setUint32(24,rate,true);v.setUint32(28,rate*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);
  w(36,"data");v.setUint32(40,samples.length*2,true);
  let o=44;
  for(let i=0;i<samples.length;i++,o+=2){
    const s=Math.max(-1,Math.min(1,samples[i]));
    v.setInt16(o,s<0?s*0x8000:s*0x7fff,true);
  }
  return new Blob([ab],{type:"audio/wav"});
}

function recall(){
  if(S.mode!=="live")return;
  const now=Date.now();
  S.selected={
    ts:Date.now(),
    text:selectedText(),
    audio:snapshotAudio(),
    shape:snapshotShape(now)
  };
  S.mode="recall";S.transitionAt=performance.now();
  if(navigator.vibrate)navigator.vibrate([10,28,10]);
}

async function keepSelected(){
  if(!S.selected)return;
  const note={
    id:(crypto.randomUUID?.() || `${Date.now()}-${Math.random()}`),
    ts:S.selected.ts,
    text:S.selected.text,
    shape:S.selected.shape,
    audio:pcmToWav(S.selected.audio,S.sampleRate)
  };
  try{
    await DB.put(note);
    S.archive=await DB.all();
    S.archiveIndex=0;
    S.mode="archive";
    S.transitionAt=performance.now();
    announce("Moment kept.");
    if(navigator.vibrate)navigator.vibrate(42);
  }catch(_){
    S.mode="fault";S.transitionAt=performance.now();
    announce("Could not keep moment.");
  }
}

async function shareCurrent(){
  const note=S.archive[S.archiveIndex];
  if(!note)return;
  S.mode="share";S.transitionAt=performance.now();
  if(navigator.vibrate)navigator.vibrate([8,35,8]);

  const files=[];
  if(note.audio){
    try{files.push(new File([note.audio],"ambient-present.wav",{type:"audio/wav"}))}catch(_){}
  }
  const data={};
  if(note.text)data.text=note.text;
  if(files.length && navigator.canShare?.({files}))data.files=files;

  setTimeout(async()=>{
    try{
      if(navigator.share) await navigator.share(data);
      else if(note.text) await navigator.clipboard.writeText(note.text);
    }catch(_){}
    S.mode="archive";S.transitionAt=performance.now();
  },520);
}

async function copyCurrent(){
  const note=S.archive[S.archiveIndex];
  if(!note?.text)return;
  S.mode="copy";S.transitionAt=performance.now();
  try{await navigator.clipboard.writeText(note.text)}catch(_){}
  if(navigator.vibrate)navigator.vibrate(14);
  setTimeout(()=>{S.mode="archive";S.transitionAt=performance.now()},600);
}

async function deleteCurrent(){
  const note=S.archive[S.archiveIndex];
  if(!note)return;
  S.mode="delete";S.transitionAt=performance.now();
  if(navigator.vibrate)navigator.vibrate([5,30,4,45,3]);
  setTimeout(async()=>{
    try{await DB.del(note.id)}catch(_){}
    S.archive=await DB.all();
    S.archiveIndex=Math.min(S.archiveIndex,Math.max(0,S.archive.length-1));
    S.mode=S.archive.length?"archive":"live";
    S.transitionAt=performance.now();
  },800);
}

/* ---------------------- gestures ---------------------- */
function point(e){
  const r=field.getBoundingClientRect();
  return{x:(e.clientX-r.left)/r.width*GRID,y:(e.clientY-r.top)/r.height*GRID};
}

field.addEventListener("pointerdown",e=>{
  const p=point(e);
  S.pointer={id:e.pointerId,x0:p.x,y0:p.y,x:p.x,y:p.y,t0:performance.now(),long:false};
  field.setPointerCapture(e.pointerId);
});

field.addEventListener("pointermove",e=>{
  if(!S.pointer||S.pointer.id!==e.pointerId)return;
  const p=point(e);S.pointer.x=p.x;S.pointer.y=p.y;
  if(S.mode==="recall"&&!S.pointer.long&&performance.now()-S.pointer.t0>=LONG_MS){
    S.pointer.long=true;
    keepSelected();
  }
});

field.addEventListener("pointerup",e=>{
  if(!S.pointer||S.pointer.id!==e.pointerId)return;
  const p=point(e);
  const dx=p.x-S.pointer.x0,dy=p.y-S.pointer.y0;
  const dist=Math.hypot(dx,dy),dur=performance.now()-S.pointer.t0;
  const now=performance.now();
  const doubleTap=now-S.tapAt<360 && dist<4;
  S.tapAt=now;

  if(S.mode==="live"){
    if(Math.abs(dx)>SWIPE && Math.abs(dx)>Math.abs(dy) && S.archive.length){
      S.mode="archive";S.archiveIndex=0;S.transitionAt=performance.now();
    }else if(dur<430&&dist<5){
      recall();
    }
  }else if(S.mode==="recall"){
    if(!S.pointer.long){
      if(dy>SWIPE && Math.abs(dy)>Math.abs(dx)){
        S.selected=null;S.mode="live";S.transitionAt=performance.now();
      }else if(dur<430&&dist<5){
        S.selected=null;S.mode="live";S.transitionAt=performance.now();
      }
    }
  }else if(S.mode==="archive"){
    if(doubleTap){
      copyCurrent();
    }else if(Math.abs(dx)>SWIPE && Math.abs(dx)>Math.abs(dy)){
      if(dx<0)S.archiveIndex=Math.min(S.archive.length-1,S.archiveIndex+1);
      else S.archiveIndex=Math.max(0,S.archiveIndex-1);
      S.transitionAt=performance.now();
      if(navigator.vibrate)navigator.vibrate(7);
    }else if(dy<-SWIPE && Math.abs(dy)>Math.abs(dx)){
      shareCurrent();
    }else if(dy>SWIPE && Math.abs(dy)>Math.abs(dx)){
      deleteCurrent();
    }else if(dur<430&&dist<5){
      S.mode="live";S.transitionAt=performance.now();
    }
  }
  S.pointer=null;
});

/* ---------------------- table behavior ---------------------- */
async function requestWakeLock(){
  try{
    if("wakeLock" in navigator)S.wake=await navigator.wakeLock.request("screen");
  }catch(_){}
}
document.addEventListener("visibilitychange",()=>{
  if(document.visibilityState==="visible"&&S.stream)requestWakeLock();
});

/* ---------------------- loop ---------------------- */
let last=performance.now();
function loop(t){
  const now=Date.now();
  const dt=Math.min(50,t-last);last=t;

  drawPermission(t);

  updateActivity();

  if(S.mode==="live"||S.mode==="recall"){
    if(now-S.lastSample>=SAMPLE_MS)deposit(now);
    prune(now);
    const settle=1-Math.min(.78,S.smooth*2.5);
    S.phase+=dt*.000038*settle;
  }

  if(S.mode==="live")drawLive(now);
  else if(S.mode==="recall")drawRecall(now);
  else if(["archive","share","copy","delete"].includes(S.mode))drawArchive(t);
  else if(S.mode==="fault")drawFault(t);
  else clear(g);

  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

/* Load kept moments before the first browse gesture. */
DB.all().then(notes=>S.archive=notes).catch(()=>{});

addEventListener("beforeunload",()=>{
  S.recognizerWanted=false;
  try{S.recognizer?.stop()}catch(_){}
  try{S.processor?.disconnect()}catch(_){}
  S.stream?.getTracks().forEach(t=>t.stop());
});

})();
</script>
