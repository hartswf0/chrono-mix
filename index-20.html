<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#070604">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>HEARD</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' fill='%23070604'/><g fill='%23f6c156'><circle cx='20' cy='32' r='2'/><circle cx='26' cy='26' r='2'/><circle cx='26' cy='32' r='3'/><circle cx='26' cy='38' r='2'/><circle cx='32' cy='20' r='2'/><circle cx='32' cy='26' r='3'/><circle cx='32' cy='32' r='4'/><circle cx='32' cy='38' r='3'/><circle cx='32' cy='44' r='2'/></g><g fill='%23e09231'><circle cx='38' cy='26' r='2'/><circle cx='38' cy='32' r='3'/><circle cx='38' cy='38' r='2'/><circle cx='44' cy='32' r='2'/></g><circle cx='48' cy='32' r='1.5' fill='%23be3d1f'/></svg>">
<link rel="icon" type="image/png" sizes="64x64" href="favicon-64.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{--bg:#070604}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);touch-action:none;-webkit-tap-highlight-color:transparent}
body{display:grid;place-items:center}
#frame{width:100vw;height:100dvh;min-height:100svh;position:relative;overflow:hidden;background:var(--bg)}
canvas{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}
.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
dialog{position:absolute;inset:0;width:100%;height:100%;max-width:none;max-height:none;margin:0;padding:0;border:0;background:rgba(7,6,4,.99);overflow:hidden}
dialog::backdrop{background:#070604}
#permitSurface{position:absolute;inset:0;width:100%;height:100%;border:0;background:transparent;padding:0}
#permitCanvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
@media (min-width:700px){
  body{background:#111}
  #frame{width:390px;height:844px;min-height:0;box-shadow:0 0 0 10px #151311,0 25px 80px #000}
}
</style>
</head>
<body>
<div id="frame">
  <canvas id="view" aria-label="Ambient recent-time field"></canvas>

  <dialog id="permissionDialog" aria-labelledby="permitLabel" aria-describedby="permitDesc">
    <button id="permitSurface" type="button">
      <span id="permitLabel" class="sr-only">Enable microphone</span>
      <span id="permitDesc" class="sr-only">Touch once to allow microphone access. The browser will show its own permission prompt.</span>
    </button>
    <canvas id="permitCanvas" aria-hidden="true"></canvas>
  </dialog>

  <div id="a11yStatus" class="sr-only" role="status" aria-live="polite"></div>
</div>

<script>
(() => {
"use strict";

const WINDOW_MS=15000, GRID=64, SAMPLE_MS=170, LONG_PRESS_MS=650, SWIPE_RELEASE=12;
const view=document.getElementById("view");
const ctx=view.getContext("2d",{alpha:false});
const dialog=document.getElementById("permissionDialog");
const permitCanvas=document.getElementById("permitCanvas");
const pctx=permitCanvas.getContext("2d",{alpha:false});
const permitSurface=document.getElementById("permitSurface");
const a11y=document.getElementById("a11yStatus");

const C={bg:[7,6,4],dim:[79,55,33],amber:[224,146,49],gold:[246,193,86],cream:[255,239,191],red:[190,61,31]};
const rgb=(c,a=1)=>`rgba(${c[0]},${c[1]},${c[2]},${a})`;
const mix=(a,b,t)=>[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t];

const state={
  mode:"sleep",
  permission:"unknown",
  stream:null,audio:null,analyser:null,data:null,
  energy:0,smooth:0,marks:[],heldMarks:null,lastSample:0,phase:0,
  pointer:null,wakeLock:null,returnTimer:null,
  words:[],recognition:null,recognitionWanted:false,
  permitT0:performance.now()
};

function setStatus(s){a11y.textContent=s}

function resizeCanvas(c,ct){
  const dpr=Math.min(devicePixelRatio||1,2);
  c.width=GRID*dpr;c.height=GRID*dpr;
  ct.setTransform(dpr,0,0,dpr,0,0);
  ct.imageSmoothingEnabled=false;
}
function resize(){resizeCanvas(view,ctx);resizeCanvas(permitCanvas,pctx)}
resize();addEventListener("resize",resize);

function clear(ct){ct.fillStyle=rgb(C.bg);ct.fillRect(0,0,GRID,GRID)}
function px(ct,x,y,c,a=1,s=1){
  if(a<=0)return;
  ct.fillStyle=rgb(c,a);
  ct.fillRect(Math.round(x),Math.round(y),s,s);
}

/* Cross-browser microphone request.
   Native browser permission UI is security chrome and cannot be styled.
   Our full-screen field is the styled pre/post permission layer. */
function legacyGetUserMedia(constraints){
  const legacy=navigator.getUserMedia||navigator.webkitGetUserMedia||navigator.mozGetUserMedia;
  if(!legacy)return Promise.reject(new Error("unsupported"));
  return new Promise((resolve,reject)=>legacy.call(navigator,constraints,resolve,reject));
}
async function getMic(){
  if(navigator.mediaDevices?.getUserMedia)return navigator.mediaDevices.getUserMedia({audio:true});
  return legacyGetUserMedia({audio:true});
}
async function queryPermission(){
  try{
    if(!navigator.permissions?.query)return "unknown";
    const result=await navigator.permissions.query({name:"microphone"});
    return result.state||"unknown";
  }catch(_){return "unknown"}
}
async function requestMicrophone(){
  if(state.permission==="asking")return;
  state.permission="asking";state.permitT0=performance.now();
  setStatus("Requesting microphone permission.");

  try{
    const stream=await getMic();
    const AC=window.AudioContext||window.webkitAudioContext;
    if(!AC)throw new Error("no-audio-context");
    const audio=new AC();
    try{await audio.resume()}catch(_){}

    const src=audio.createMediaStreamSource(stream);
    const analyser=audio.createAnalyser();
    analyser.fftSize=256;
    analyser.smoothingTimeConstant=.86;
    src.connect(analyser);

    state.stream=stream;state.audio=audio;state.analyser=analyser;
    state.data=new Uint8Array(analyser.frequencyBinCount);
    state.permission="granted";state.mode="listening";state.permitT0=performance.now();

    setStatus("Microphone enabled.");
    startRecognition();
    requestWakeLock();
    if(navigator.vibrate)navigator.vibrate(12);

    setTimeout(()=>{if(dialog.open)dialog.close()},700);
  }catch(err){
    const n=err?.name||"";
    state.permission=(n==="NotAllowedError"||n==="PermissionDeniedError")?"denied":"unsupported";
    state.permitT0=performance.now();
    if(state.permission==="denied"){
      setStatus("Microphone permission was not granted. Touch again to retry. If prompts are blocked, change microphone access in site settings.");
    }else{
      setStatus("Microphone access is unavailable in this browser or context. Use a supported browser over HTTPS.");
    }
    if(navigator.vibrate)navigator.vibrate([8,35,8]);
  }
}
permitSurface.addEventListener("click",requestMicrophone);

try{dialog.showModal()}catch(_){dialog.setAttribute("open","")}
queryPermission().then(s=>{
  if(s==="denied"){state.permission="denied";state.permitT0=performance.now()}
});

/* Styled permission-state motion: invite -> converge -> cohere, or open apart on denial. */
function drawPermit(t){
  clear(pctx);
  const cx=GRID*.5,cy=GRID*.5;
  const age=(t-state.permitT0)/1000;
  const breath=(Math.sin(t*.0011)+1)*.5;

  if(state.permission==="unknown"){
    const pts=[[-7,-3],[6,-4],[-4,6],[7,5],[0,0]];
    pts.forEach((p,i)=>{
      const q=.72+.28*Math.sin(t*.001+i);
      px(pctx,cx+p[0]*q,cy+p[1]*q,i===4?C.cream:C.amber,.42+(i===4?.35:breath*.14),i===4?2:1);
    });
  }else if(state.permission==="asking"){
    for(let i=0;i<18;i++){
      const a=i/18*Math.PI*2;
      const k=Math.max(.08,1-Math.min(age/2,1));
      const r=4+13*k;
      px(pctx,cx+Math.cos(a)*r,cy+Math.sin(a)*r*.72,C.gold,.35,1);
    }
    px(pctx,cx,cy,C.cream,.9,2);
  }else if(state.permission==="granted"){
    const open=Math.min(age/.65,1);
    for(let y=-10;y<=10;y++){
      for(let x=-10;x<=10;x++){
        const rr=Math.hypot(x,y*1.15);
        if(rr>10)continue;
        const seed=(x*37+y*17)&7;
        if(seed>3)continue;
        const col=x>4?C.amber:C.gold;
        px(pctx,cx+x*open,cy+y*open,col,(1-open)*.35+.48,1);
      }
    }
  }else{
    const col=state.permission==="denied"?C.red:C.dim;
    for(let i=0;i<20;i++){
      const a=i/20*Math.PI*2;
      const r=7+(i%3)*3+Math.min(age,2)*2;
      const split=Math.cos(a)>0?3:-3;
      px(pctx,cx+Math.cos(a)*r+split,cy+Math.sin(a)*r*.68,col,.28,1);
    }
    px(pctx,cx-3,cy,C.gold,.36,1);px(pctx,cx+3,cy,C.gold,.36,1);
  }
}

function updateEnergy(){
  if(!state.analyser)return;
  state.analyser.getByteFrequencyData(state.data);
  let sum=0,n=Math.min(44,state.data.length);
  for(let i=2;i<n;i++)sum+=state.data[i];
  const raw=sum/n/255;
  state.energy=raw;state.smooth+=(raw-state.smooth)*.07;
}
function addMark(now){
  const speaking=Math.max(0,Math.min(1,(state.smooth-.03)/.20));
  const coherence=.18+speaking*.78;
  state.marks.push({
    born:now,speaking,coherence,
    a:state.phase+(Math.random()-.5)*(1.8-coherence*1.55),
    r:7+Math.random()*(16-coherence*6),seed:Math.random()
  });
  state.lastSample=now;
}
function prune(now){
  state.marks=state.marks.filter(m=>now-m.born<=WINDOW_MS);
  state.words=state.words.filter(w=>now-w.t<=WINDOW_MS+4000);
}
function pos(m,now,mode=state.mode){
  const age=Math.max(0,Math.min(1,(now-m.born)/WINDOW_MS));
  const cx=GRID*.5,cy=GRID*.48;
  let a=m.a+age*.21,r=m.r+age*5.5;
  let x=cx+Math.cos(a)*r-age*7.5;
  let y=cy+Math.sin(a)*r*.78;
  if(mode==="recall"){x+=(1-age)*3.5;y+=(age-.5)*.8}
  if(mode==="held"){
    x=cx+Math.cos(m.a)*(m.r+age*1.2)-age*3.2;
    y=cy+Math.sin(m.a)*(m.r+age*1.2)*.78;
  }
  return{x,y,age};
}
function drawListening(now){
  clear(ctx);const cx=GRID*.5,cy=GRID*.48;
  px(ctx,cx,cy,C.cream,.46+state.smooth*.7,state.smooth>.14?2:1);
  for(const m of state.marks){
    const p=pos(m,now,"listening"),life=Math.pow(1-p.age,.62);
    let col=mix(C.dim,C.amber,1-p.age);col=mix(col,C.cream,m.speaking*.68);
    const alpha=life*(.18+m.speaking*.78);
    px(ctx,p.x,p.y,col,alpha,m.speaking>.62?2:1);
    if(m.speaking>.35&&p.age<.72){
      const q=.12+m.speaking*.20;
      px(ctx,p.x+(cx-p.x)*q,p.y+(cy-p.y)*q,C.cream,alpha*.42,1);
    }
  }
}
function drawRecall(now){
  clear(ctx);const cx=GRID*.5,cy=GRID*.48;
  for(const m of state.marks){
    const p=pos(m,now,"recall"),life=Math.pow(1-p.age,.55);
    let col=mix(C.dim,C.gold,1-p.age);col=mix(col,C.cream,.18+m.speaking*.55);
    px(ctx,p.x,p.y,col,life*(.30+m.speaking*.64),m.speaking>.50?2:1);
  }
  for(let y=18;y<47;y+=2){
    const yy=(y-cy)/14,x=cx+Math.sqrt(Math.max(0,1-yy*yy))*15.5;
    px(ctx,x+2,y,C.cream,.56,1);
  }
}
function drawHeld(now){
  clear(ctx);const cx=GRID*.5,cy=GRID*.48;
  for(const m of state.heldMarks||[]){
    const p=pos(m,now,"held"),col=mix(C.amber,C.cream,m.speaking*.60);
    px(ctx,p.x,p.y,col,.62+m.speaking*.28,m.speaking>.58?2:1);
  }
  for(let a=0;a<Math.PI*2;a+=.13)px(ctx,cx+Math.cos(a)*19,cy+Math.sin(a)*14.7,C.amber,.30,1);
}
function drawFault(t){
  clear(ctx);const cx=GRID*.5,cy=GRID*.5;
  for(let i=0;i<18;i++){
    const a=i/18*Math.PI*2,r=9+Math.sin(t*.001+i)*2;
    px(ctx,cx+Math.cos(a)*r,cy+Math.sin(a)*r,C.red,.24,1);
  }
}

function recall(){
  if(!state.stream)return;
  state.mode="recall";
  clearTimeout(state.returnTimer);
  state.returnTimer=setTimeout(()=>{if(state.mode==="recall")state.mode="listening"},10000);
  if(navigator.vibrate)navigator.vibrate([10,24,10]);
}
function hold(){
  if(state.mode!=="recall")return;
  state.heldMarks=state.marks.map(m=>({...m}));state.mode="held";
  clearTimeout(state.returnTimer);
  if(navigator.vibrate)navigator.vibrate(18);
}
function release(){
  if(state.mode!=="held")return;
  state.heldMarks=null;state.mode="listening";
  if(navigator.vibrate)navigator.vibrate(10);
}
function logicalPoint(e){
  const r=view.getBoundingClientRect();
  return{x:(e.clientX-r.left)/r.width*GRID,y:(e.clientY-r.top)/r.height*GRID};
}
view.addEventListener("pointerdown",e=>{
  const p=logicalPoint(e);
  state.pointer={id:e.pointerId,x0:p.x,y0:p.y,t0:performance.now(),held:false};
  view.setPointerCapture(e.pointerId);
});
view.addEventListener("pointermove",e=>{
  if(!state.pointer||state.pointer.id!==e.pointerId)return;
  if(state.mode==="recall"&&!state.pointer.held&&performance.now()-state.pointer.t0>LONG_PRESS_MS){
    state.pointer.held=true;hold();
  }
});
view.addEventListener("pointerup",e=>{
  if(!state.pointer||state.pointer.id!==e.pointerId)return;
  const p=logicalPoint(e),dx=p.x-state.pointer.x0,dy=p.y-state.pointer.y0;
  const dist=Math.hypot(dx,dy),duration=performance.now()-state.pointer.t0;
  if(state.mode==="listening"&&duration<420&&dist<5)recall();
  else if(state.mode==="recall"&&!state.pointer.held){
    if(duration>=LONG_PRESS_MS)hold();else if(dist<5)state.mode="listening";
  }else if(state.mode==="held"){
    if(dist>SWIPE_RELEASE)release();else if(duration<420)state.mode="recall";
  }
  state.pointer=null;
});

/* Optional browser speech recognition. The visual field never depends on it. */
function startRecognition(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR)return;
  try{
    const r=new SR();r.continuous=true;r.interimResults=true;r.lang="en-US";
    state.recognition=r;state.recognitionWanted=true;
    r.onresult=e=>{
      const now=Date.now();
      for(let i=e.resultIndex;i<e.results.length;i++){
        const result=e.results[i],text=result[0].transcript.trim();
        if(!text)continue;
        state.words=state.words.filter(w=>!w.interim);
        state.words.push({t:now,text,interim:!result.isFinal});
      }
    };
    r.onend=()=>{
      if(state.recognitionWanted&&state.stream)setTimeout(()=>{try{r.start()}catch(_){}},250);
    };
    r.start();
  }catch(_){}
}

/* Desert Ant integration points for a bundled production build:
   Clear  -> voice cleanup before replay/export/transcription
   Ear    -> spoken-language routing for longer recordings/archives
   Redact -> local PII scrub before copy/share/send
   Voz    -> not a browser SDK today
   Align  -> native Apple/SpeechAnalyzer path, not browser
*/
const DesertAntAdapters={clearAudio:null,identifyLanguage:null,redactText:null};

async function requestWakeLock(){
  try{if("wakeLock" in navigator)state.wakeLock=await navigator.wakeLock.request("screen")}catch(_){}
}
document.addEventListener("visibilitychange",()=>{
  if(document.visibilityState==="visible"&&state.stream)requestWakeLock();
});

let last=performance.now();
function loop(t){
  const now=Date.now(),dt=Math.min(50,t-last);last=t;
  drawPermit(t);
  updateEnergy();

  if(state.mode==="listening"||state.mode==="recall"){
    if(now-state.lastSample>=SAMPLE_MS)addMark(now);
    prune(now);
    const settle=1-Math.min(.76,state.smooth*2.4);
    state.phase+=dt*.000042*settle;
  }

  if(state.mode==="listening")drawListening(now);
  else if(state.mode==="recall")drawRecall(now);
  else if(state.mode==="held")drawHeld(now);
  else if(state.mode==="fault")drawFault(t);
  else clear(ctx);

  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

addEventListener("beforeunload",()=>{
  state.recognitionWanted=false;
  try{state.recognition?.stop()}catch(_){}
  state.stream?.getTracks().forEach(t=>t.stop());
});
})();
</script>
</body>
</html>
