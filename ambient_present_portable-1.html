<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Ambient Present</title>
<meta name="theme-color" content="#0b0b09">
<meta name="color-scheme" content="dark light">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230b0b09'/%3E%3Ccircle cx='32' cy='32' r='16' fill='%23f4c928'/%3E%3Ccircle cx='32' cy='32' r='23' fill='none' stroke='%23f3efe3' stroke-opacity='.36'/%3E%3C/svg%3E">
<style>
  :root{
    --bg:#0b0b09;
    --fg:#f3efe3;
    --dim:#8f8a7e;
    --sun:#f4c928;
    --line:rgba(243,239,227,.18);
    --panel:rgba(243,239,227,.04);
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--fg);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  body{min-height:100vh;display:grid;place-items:center;padding:18px}
  #app{width:min(760px,100%);display:grid;gap:14px}
  .frame{
    position:relative;
    aspect-ratio:9/16;
    max-height:82vh;
    border:1px solid var(--line);
    overflow:hidden;
    background:var(--bg);
  }
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
  .topline,.bottomline{
    position:absolute;left:0;right:0;display:flex;justify-content:space-between;
    padding:14px 16px;pointer-events:none;font-size:11px;letter-spacing:.18em;text-transform:uppercase
  }
  .topline{top:0}.bottomline{bottom:0;align-items:flex-end}
  .small{color:var(--dim)}
  .stateDot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--sun);vertical-align:middle;margin-left:6px}
  .transcript{
    position:absolute;left:7%;right:7%;bottom:11%;
    display:none;padding:14px 16px;border-top:1px solid var(--line);
    font-family:Georgia,serif;font-size:clamp(18px,4vw,32px);line-height:1.2;
    background:linear-gradient(to bottom,rgba(11,11,9,0),rgba(11,11,9,.85) 22%,rgba(11,11,9,.98));
  }
  .transcript.show{display:none}
  .noteGhost{position:absolute;inset:12% 8% 12% 8%;pointer-events:none;opacity:0}
  .noteGhost.show{opacity:1}
  .hud{
    position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    width:72%;aspect-ratio:1;border-radius:50%;pointer-events:none;
  }
  .controls{display:grid;grid-template-columns:repeat(5,1fr);border:1px solid var(--line)}
  button{
    appearance:none;border:0;border-right:1px solid var(--line);background:transparent;color:var(--fg);
    min-height:50px;padding:10px 8px;font:inherit;font-size:12px;letter-spacing:.12em;text-transform:uppercase
  }
  button:last-child{border-right:0}
  button:disabled{opacity:.28}
  button:focus-visible{outline:2px solid var(--sun);outline-offset:-2px}
  button[data-active="true"]{background:var(--fg);color:var(--bg)}
  .strip{
    display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;
    border:1px solid var(--line);padding:10px 12px
  }
  .ticks{display:grid;grid-template-columns:repeat(15,1fr);gap:4px;align-items:end;height:22px}
  .tick{height:4px;background:var(--line)}
  .tick.on{background:var(--sun)}
  .meta{font-size:11px;letter-spacing:.08em;color:var(--dim)}
  .mono{filter:grayscale(1)}
  @media (max-width:520px){
    body{padding:0}
    #app{gap:0}
    .frame{border-left:0;border-right:0;max-height:none}
    .controls{border-left:0;border-right:0}
    .strip{border-left:0;border-right:0}
  }

  dialog{
    width:min(420px,calc(100% - 28px));
    border:1px solid rgba(243,239,227,.22);
    border-radius:0;
    padding:0;
    color:var(--fg);
    background:#0b0b09;
    box-shadow:none;
  }
  dialog::backdrop{background:rgba(0,0,0,.76);backdrop-filter:blur(4px)}
  .permission{
    display:grid;
    gap:0;
  }
  .permission-art{
    min-height:190px;
    display:grid;
    place-items:center;
    border-bottom:1px solid var(--line);
    background:
      radial-gradient(circle at 50% 50%, rgba(244,201,40,.16), transparent 34%),
      #0b0b09;
  }
  .permission-orb{
    width:112px;height:112px;border-radius:50%;
    border:1px solid rgba(243,239,227,.45);
    position:relative;
  }
  .permission-orb::before{
    content:"";position:absolute;inset:28px;border-radius:50%;background:var(--sun);
  }
  .permission-orb::after{
    content:"";position:absolute;inset:-18px;border:1px dotted rgba(243,239,227,.22);border-radius:50%;
  }
  .permission-copy{padding:18px 18px 14px;display:grid;gap:9px}
  .permission-copy h2{font:500 18px/1.2 Georgia,serif;margin:0}
  .permission-copy p{margin:0;color:var(--dim);font-size:12px;line-height:1.55}
  .permission-actions{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line)}
  .permission-actions button{border-right:1px solid var(--line);min-height:56px}
  .permission-actions button:last-child{border-right:0}
  .permission-actions .primary{background:var(--fg);color:var(--bg)}
  #audioFallback{display:none}
</style>
</head>
<body>
<div id="app">
  <div class="frame" id="frame" aria-label="Ambient memory field">
    <canvas id="c"></canvas>
    <div class="topline" aria-hidden="true">
      <div id="stateLabel"></div>
      <div><span id="privacyLabel"></span><span class="stateDot"></span></div>
    </div>
    <div class="transcript" id="transcript" aria-live="polite"></div><div id="noteGhost" class="noteGhost" aria-hidden="true"></div>
    <div class="bottomline">
      <div class="small" id="hint"></div>
      <div class="small" id="age"></div>
    </div>
  </div>

  <div class="strip">
    <div class="ticks" id="ticks" aria-hidden="true"></div>
    <div class="meta" id="meta">0.0s held</div>
  </div>

  <div class="controls">
    <button id="listenBtn" aria-label="Listen">○</button>
    <button id="recallBtn" aria-label="Recall" disabled>◐</button>
    <button id="playBtn" aria-label="Play" disabled>◎</button>
    <button id="keepBtn" aria-label="Keep" disabled>●</button>
    <button id="eraseBtn" aria-label="Erase" disabled>×</button>
  </div>
</div>

<dialog id="permissionDialog" aria-labelledby="permissionTitle">
  <div class="permission">
    <div class="permission-art" aria-hidden="true"><div class="permission-orb"></div></div>
    <div class="permission-copy">
      <h2 id="permissionTitle">Let the field hear the room</h2>
      <p>Audio stays in this browser session unless you explicitly keep a moment. Your browser will show its own microphone permission prompt next.</p>
      <p id="permissionStatus"></p>
    </div>
    <div class="permission-actions">
      <button type="button" id="permissionCancel">Not now</button>
      <button type="button" id="permissionAllow" class="primary">Continue</button>
    </div>
  </div>
</dialog>
<input id="audioFallback" type="file" accept="audio/*" capture="microphone">

<script>
(() => {
  const root = document.documentElement;
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const frame = document.getElementById('frame');
  const stateLabel = document.getElementById('stateLabel');
  const hint = document.getElementById('hint');
  const meta = document.getElementById('meta');
  const transcript = document.getElementById('transcript');
  const noteGhost = document.getElementById('noteGhost');
  const listenBtn = document.getElementById('listenBtn');
  const recallBtn = document.getElementById('recallBtn');
  const playBtn = document.getElementById('playBtn');
  const keepBtn = document.getElementById('keepBtn');
  const eraseBtn = document.getElementById('eraseBtn');
  const ticksEl = document.getElementById('ticks');
  const permissionDialog = document.getElementById('permissionDialog');
  const permissionAllow = document.getElementById('permissionAllow');
  const permissionCancel = document.getElementById('permissionCancel');
  const permissionStatus = document.getElementById('permissionStatus');
  const audioFallback = document.getElementById('audioFallback');

  for(let i=0;i<15;i++){
    const d=document.createElement('div'); d.className='tick'; ticksEl.appendChild(d);
  }
  const ticks=[...ticksEl.children];

  let W=0,H=0,dpr=1;
  function resize(){
    const r=canvas.getBoundingClientRect(); dpr=Math.min(devicePixelRatio||1,2);
    canvas.width=Math.round(r.width*dpr); canvas.height=Math.round(r.height*dpr);
    W=r.width; H=r.height; ctx.setTransform(dpr,0,0,dpr,0,0);
  }
  new ResizeObserver(resize).observe(canvas); resize();

  let stream=null,audioCtx=null,analyser=null,source=null;
  let mediaRecorder=null,chunks=[];
  let recognition=null, transcriptLog=[];
  let state='rest', startedAt=0, heldAt=0;
  let lastBlob=null,lastUrl=null;
  let keepBlob=null;
  let notes=[];
  let noteIndex=-1;
  let noteMode=false;
  const HOLD_MS=15000;

  function setState(s){
    state=s; stateLabel.textContent=s;
    listenBtn.dataset.active=(s==='listening');
    recallBtn.disabled=!(s==='listening');
    playBtn.disabled=!(s==='recalled' && lastBlob);
    keepBtn.disabled=!(s==='recalled' && lastBlob);
    eraseBtn.disabled=!(s==='recalled' || s==='kept');
    transcript.classList.remove('show');
    hint.textContent = '';
    stateLabel.textContent = '';
    document.getElementById('privacyLabel').textContent = '';
  }

  function trimChunks(){
    const now=performance.now();
    chunks = chunks.filter(x => now - x.t < HOLD_MS + 2500);
  }

  async function acquireMic(){
    if(stream) return;
    try{
      stream=await navigator.mediaDevices.getUserMedia({audio:true});
      audioCtx=new (window.AudioContext||window.webkitAudioContext)();
      source=audioCtx.createMediaStreamSource(stream);
      analyser=audioCtx.createAnalyser(); analyser.fftSize=512; analyser.smoothingTimeConstant=.86;
      source.connect(analyser);

      const mime = MediaRecorder.isTypeSupported('audio/webm;codecs=opus') ? 'audio/webm;codecs=opus' : 'audio/webm';
      mediaRecorder=new MediaRecorder(stream,{mimeType:mime});
      mediaRecorder.ondataavailable=e=>{
        if(e.data && e.data.size) chunks.push({t:performance.now(),blob:e.data});
        trimChunks();
      };
      mediaRecorder.start(1000);
      startedAt=performance.now();
      setState('listening');

      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      if(SR){
        recognition=new SR();
        recognition.continuous=true;
        recognition.interimResults=false;
        recognition.lang='en-US';
        recognition.onresult=e=>{
          const now=performance.now();
          for(let i=e.resultIndex;i<e.results.length;i++){
            if(e.results[i].isFinal){
              transcriptLog.push({t:now,text:e.results[i][0].transcript.trim()});
              transcriptLog=transcriptLog.filter(x=>now-x.t<60000);
            }
          }
        };
        recognition.onend=()=>{ if(stream && state==='listening') try{recognition.start()}catch{} };
        try{recognition.start()}catch{}
      }
    }catch(err){
      permissionStatus.textContent = (location.protocol !== 'https:' && location.hostname !== 'localhost')
        ? 'Live microphone access requires HTTPS or localhost.'
        : 'Microphone access was unavailable. You can retry from the field.';
      try{ permissionDialog.showModal(); }catch{}
      setState('rest');
    }
  }

  async function startListening(){
    if(stream){ setState('listening'); return; }
    const canMic = !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia);
    if(!canMic){
      permissionStatus.textContent='This browser does not expose live microphone capture. Choose an audio file instead.';
      try{ permissionDialog.showModal(); }catch{}
      return;
    }
    permissionStatus.textContent='';
    try{ permissionDialog.showModal(); }catch{ acquireMic(); }
  }

  permissionAllow.addEventListener('click', async ()=>{
    permissionDialog.close();
    await acquireMic();
  });
  permissionCancel.addEventListener('click', ()=>permissionDialog.close());

  async function recall(){
    if(!stream || !chunks.length) return;
    heldAt=performance.now();
    trimChunks();
    const held = chunks.filter(x=>heldAt-x.t<=HOLD_MS+1200).map(x=>x.blob);
    if(lastUrl) URL.revokeObjectURL(lastUrl);
    lastBlob=new Blob(held,{type:mediaRecorder?.mimeType||'audio/webm'});
    lastUrl=URL.createObjectURL(lastBlob);

    const recent = transcriptLog.filter(x=>heldAt-x.t<=HOLD_MS+1000).map(x=>x.text);
    transcript.textContent = recent.join(' ');
    setState('recalled');
  }

  function playRecall(){
    if(!lastUrl) return;
    const a=new Audio(lastUrl);
    a.play();
  }

  async function keepRecall(){
    if(!lastBlob) return;
    keepBlob=lastBlob;
    notes.push({
      blob:lastBlob,
      text:transcript.textContent,
      t:Date.now(),
      seed:Math.random()*1000
    });
    noteIndex=notes.length-1;
    noteMode=true;
    setState('kept');
  }

  function erase(){
    if(lastUrl) URL.revokeObjectURL(lastUrl);
    lastUrl=null; lastBlob=null; keepBlob=null;
    transcript.textContent='';
    if(noteMode && noteIndex>=0){ notes.splice(noteIndex,1); noteIndex=Math.min(noteIndex,notes.length-1); }
    noteMode=false;
    setState(stream?'listening':'rest');
  }

  listenBtn.addEventListener('click', startListening);
  recallBtn.addEventListener('click', recall);
  playBtn.addEventListener('click', playRecall);
  keepBtn.addEventListener('click', keepRecall);
  eraseBtn.addEventListener('click', erase);
  frame.addEventListener('click',()=> state==='recalled' ? setState('listening') : (state==='listening' ? recall() : startListening()));


  let downX=0;
  frame.addEventListener('pointerdown',e=>{downX=e.clientX});
  frame.addEventListener('pointerup',e=>{
    const dx=e.clientX-downX;
    if(Math.abs(dx)>45 && notes.length){
      noteMode=true;
      noteIndex = dx<0 ? (noteIndex+1+notes.length)%notes.length : (noteIndex-1+notes.length)%notes.length;
      setState('kept');
    }
  });
  window.addEventListener('keydown',e=>{
    if(!notes.length) return;
    if(e.key==='ArrowRight'){ noteMode=true; noteIndex=(noteIndex+1+notes.length)%notes.length; setState('kept'); }
    if(e.key==='ArrowLeft'){ noteMode=true; noteIndex=(noteIndex-1+notes.length)%notes.length; setState('kept'); }
    if(e.key==='Delete' && noteMode){ erase(); }
  });


  async function probePermission(){
    if(!navigator.permissions || !navigator.permissions.query) return;
    try{
      const status=await navigator.permissions.query({name:'microphone'});
      if(status.state==='granted') permissionStatus.textContent='';
      status.addEventListener?.('change',()=>{ permissionStatus.textContent=''; });
    }catch{}
  }
  probePermission();

  const freq=new Uint8Array(256);
  let phase=0;
  function draw(){
    requestAnimationFrame(draw);
    ctx.clearRect(0,0,W,H);

    let energy=.05, centroid=.35;
    if(analyser){
      analyser.getByteFrequencyData(freq);
      let sum=0, weighted=0;
      for(let i=1;i<120;i++){ sum+=freq[i]; weighted+=freq[i]*i; }
      energy=Math.min(1,sum/(119*120));
      centroid=sum?Math.min(1,(weighted/sum)/120):.35;
    }

    const cx=W/2, cy=H*.48;
    const R=Math.min(W,H)*.265;
    phase += .0025 + energy*.009;

    ctx.save();
    ctx.translate(cx,cy);

    const remembered = noteMode && notes[noteIndex];
    const mode = remembered ? 'memory' : state;

    // temporal tomography: 15 latitudes = 15 seconds, one mark = one acoustic/token cell
    for(let sidx=0;sidx<15;sidx++){
      const age=sidx/14;
      const yy=(age-.5)*R*1.55;
      const rr=R*Math.sqrt(Math.max(0,1-Math.pow(yy/(R*.82),2)));
      const cols=22;
      for(let i=0;i<cols;i++){
        const u=i/(cols-1);
        const x=(u-.5)*rr*2;
        const sphereZ=Math.sqrt(Math.max(0,1-(x/(rr||1))**2));
        let pulse = energy;
        if(mode==='recalled') pulse=.58;
        if(mode==='kept' || mode==='memory') pulse=.32;
        const wave=Math.sin(i*.62+sidx*.47+phase*2.2);
        const deform=(wave*pulse*8)*(1-age*.35);
        const px=x + deform*Math.sin(phase+sidx*.1);
        const py=yy + deform*.24;
        const facing=.18+.82*sphereZ;
        const size=.7 + 2.9*facing*(.25+pulse);
        let alpha=.14+.68*facing;
        if(mode==='rest') alpha*=.52;
        if(mode==='recalled' && Math.abs(age-.55)<.12) alpha=1;
        if(mode==='kept'||mode==='memory') alpha*=.82;
        ctx.fillStyle=`rgba(244,201,40,${alpha})`;
        ctx.beginPath(); ctx.arc(px,py,size,0,Math.PI*2); ctx.fill();
      }
    }

    // newest edge / present
    ctx.strokeStyle=`rgba(244,201,40,${.18+.5*energy})`;
    ctx.lineWidth=1;
    ctx.beginPath();
    ctx.ellipse(0,-R*.77,R*.22,R*.06,0,0,Math.PI*2);
    ctx.stroke();

    // state transformations encoded only by form
    if(mode==='recalled'){
      for(let k=0;k<4;k++){
        ctx.strokeStyle=`rgba(243,239,227,${.55-k*.1})`;
        ctx.lineWidth=1;
        ctx.beginPath(); ctx.ellipse(0,0,R*(.34+k*.11),R*(.18+k*.055),0,0,Math.PI*2); ctx.stroke();
      }
    }
    if(mode==='kept'||mode==='memory'){
      ctx.strokeStyle='rgba(243,239,227,.9)';
      ctx.lineWidth=1.2;
      ctx.beginPath(); ctx.arc(0,0,R*.74,0,Math.PI*2); ctx.stroke();
    }
    if(mode==='listening'){
      const a=phase%(Math.PI*2);
      ctx.fillStyle='rgba(243,239,227,.9)';
      ctx.beginPath(); ctx.arc(Math.cos(a)*R*.9,Math.sin(a)*R*.9,2.2+energy*2,0,Math.PI*2); ctx.fill();
    }

    // fault / erasure visual
    if(!stream && state==='rest'){
      ctx.fillStyle='rgba(243,239,227,.45)';
      for(let i=0;i<12;i++){
        const a=i/12*Math.PI*2;
        ctx.beginPath();ctx.arc(Math.cos(a)*R*.88,Math.sin(a)*R*.88,1,0,Math.PI*2);ctx.fill();
      }
    }

    ctx.restore();

    // one-pixel-per-second strip; no text needed
    if(stream){
      const elapsed=Math.min(HOLD_MS,performance.now()-startedAt);
      const held=Math.floor(elapsed/1000);
      ticks.forEach((t,i)=>t.classList.toggle('on',i<held));
      meta.textContent='';
    }else{
      ticks.forEach(t=>t.classList.remove('on'));
      meta.textContent='';
    }
  }
  draw();

  window.addEventListener('beforeunload',()=>{
    try{stream?.getTracks().forEach(t=>t.stop())}catch{}
    try{recognition?.stop()}catch{}
    try{audioCtx?.close()}catch{}
    if(lastUrl) URL.revokeObjectURL(lastUrl);
  });
})();
</script>
</body>
</html>
