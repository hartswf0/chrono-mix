<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<link rel="icon" href="data:," />
<title>RC-4 LAB</title>
<link rel="stylesheet" href="instrument.css" />
</head>
<body>
<div class="device">
  <section class="mod">
    <div class="head">
      <div>
        <div class="brand">RETRO CACHE</div>
        <a class="model" href="index.html">RC-4 · LAB · MULTI-SOURCE</a>
      </div>
      <div class="leds">
        <span class="led" id="stbyLed"><i></i>STBY</span>
        <span class="led rec" id="recLed"><i></i>REC</span>
      </div>
    </div>
    <div class="row">
      <select id="srcSelect"></select>
    </div>
    <canvas id="liveView" class="screen" width="480" height="90"></canvas>
    <div class="bars">
      <div class="bar"><span>RING</span><canvas id="ringBar" width="240" height="12"></canvas></div>
      <div class="bar"><span>QUEUE</span><canvas id="queueBar" width="240" height="12"></canvas></div>
    </div>
    <div class="lcds">
      <div class="lcd"><label>LOOK S</label><b id="lookLcd">0.0</b></div>
      <div class="lcd"><label>PERS</label><b id="persLcd">0</b></div>
      <div class="lcd"><label>DROP</label><b id="dropLcd">0</b></div>
      <div class="lcd wide"><label>VALUES</label><b id="valLcd">--</b></div>
      <div class="lcd wide"><label>STATUS</label><b id="errLcd">READY</b></div>
    </div>
    <div class="keys">
      <button class="key armk" id="armBtn">ARM</button>
      <button class="key trig" id="trigBtn" disabled>TRIG</button>
      <button class="key" id="stopBtn" disabled>STOP</button>
    </div>
  </section>

  <section class="mod">
    <canvas id="plotView" class="screen" width="480" height="280"></canvas>
    <div class="row">
      <button class="key small" id="csvBtn" disabled>CSV</button>
      <div class="lcd" style="flex:1"><label>TAKE S</label><b id="takeLcd">--</b></div>
      <div class="lcd" style="flex:1"><label>PRE N</label><b id="preLcd">--</b></div>
    </div>
    <div class="legend">
      <span><span class="chip" style="background:var(--cache)"></span>CACHE</span>
      <span><span class="chip" style="background:var(--live)"></span>LIVE</span>
      <span><span class="chip" style="background:#ff3b3b"></span>GAP</span>
    </div>
  </section>
</div>

<script type="module">
import { RetroCaptureEngine, MemorySink, State } from './retrocache.js';
import { makeTimestamper, plotFrames, framesToCSV, download } from './demo-ui.js';
import { wirePanel, wireTransport } from './instrument.js';

const $ = (id) => document.getElementById(id);

/** Source adapters: rate (Hz), pre-roll (s), channels, start(cb,onErr)/stop(). */
const SOURCES = {
  pointer: {
    label: 'PTR · POINTER/TOUCH · 60HZ · 10S', rate: 60, preroll: 10,
    channels: ['x', 'y', 'pressure', 'dx', 'dy'],
    available: () => true,
    start(cb) {
      this._h = (e) => cb([e.clientX, e.clientY, e.pressure ?? 0, e.movementX ?? 0, e.movementY ?? 0]);
      window.addEventListener('pointermove', this._h);
      window.addEventListener('pointerdown', this._h);
    },
    stop() { window.removeEventListener('pointermove', this._h); window.removeEventListener('pointerdown', this._h); },
  },
  geolocation: {
    label: 'GPS · GEOLOCATION · 1HZ · 300S', rate: 1, preroll: 300,
    channels: ['lat', 'lon', 'accuracy_m', 'speed', 'heading'],
    available: () => 'geolocation' in navigator,
    start(cb, onErr) {
      this._id = navigator.geolocation.watchPosition(
        (p) => cb([p.coords.latitude, p.coords.longitude, p.coords.accuracy,
                   p.coords.speed ?? 0, p.coords.heading ?? 0]),
        (e) => onErr(new Error(e.message)),
        { enableHighAccuracy: true, maximumAge: 0 },
      );
    },
    stop() { navigator.geolocation.clearWatch(this._id); },
  },
  gyroscope: {
    label: 'GYR · GYROSCOPE · 60HZ · 15S', rate: 60, preroll: 15,
    channels: ['x_rad_s', 'y_rad_s', 'z_rad_s'],
    available: () => 'Gyroscope' in window,
    start(cb, onErr) {
      this._s = new Gyroscope({ frequency: 60 });
      this._s.onreading = () => cb([this._s.x, this._s.y, this._s.z]);
      this._s.onerror = (e) => onErr(new Error(e.error?.message ?? 'sensor error'));
      this._s.start();
    },
    stop() { this._s?.stop(); },
  },
  magnetometer: {
    label: 'MAG · MAGNETOMETER · 10HZ · 60S', rate: 10, preroll: 60,
    channels: ['x_uT', 'y_uT', 'z_uT'],
    available: () => 'Magnetometer' in window,
    start(cb, onErr) {
      this._s = new Magnetometer({ frequency: 10 });
      this._s.onreading = () => cb([this._s.x, this._s.y, this._s.z]);
      this._s.onerror = (e) => onErr(new Error(e.error?.message ?? 'sensor error'));
      this._s.start();
    },
    stop() { this._s?.stop(); },
  },
  ambientlight: {
    label: 'LUX · AMBIENT LIGHT · 10HZ · 60S', rate: 10, preroll: 60,
    channels: ['illuminance_lux'],
    available: () => 'AmbientLightSensor' in window,
    start(cb, onErr) {
      this._s = new AmbientLightSensor({ frequency: 10 });
      this._s.onreading = () => cb([this._s.illuminance]);
      this._s.onerror = (e) => onErr(new Error(e.error?.message ?? 'sensor error'));
      this._s.start();
    },
    stop() { this._s?.stop(); },
  },
  battery: {
    label: 'BAT · BATTERY · 1HZ · 600S', rate: 1, preroll: 600,
    channels: ['level_pct', 'charging'],
    available: () => 'getBattery' in navigator,
    async start(cb) {
      const b = await navigator.getBattery();
      this._t = setInterval(() => cb([b.level * 100, b.charging ? 1 : 0]), 1000);
    },
    stop() { clearInterval(this._t); },
  },
};

const srcSelect = $('srcSelect');
for (const [key, s] of Object.entries(SOURCES)) {
  const opt = document.createElement('option');
  opt.value = key;
  opt.textContent = s.label + (s.available() ? '' : ' — N/A');
  opt.disabled = !s.available();
  srcSelect.appendChild(opt);
}
srcSelect.value = [...srcSelect.options].find((o) => !o.disabled)?.value ?? 'pointer';

const live = $('liveView'); const lctx = live.getContext('2d');
let engine = null, source = null;
const sink = new MemorySink();
const now = makeTimestamper();
let payload = null, payloadF32 = null;

wirePanel(() => engine, {
  stbyLed: $('stbyLed'), recLed: $('recLed'),
  lookLcd: $('lookLcd'), persLcd: $('persLcd'), dropLcd: $('dropLcd'),
  ringBar: $('ringBar'), queueBar: $('queueBar'),
});

lctx.fillStyle = '#0b0d0b'; lctx.fillRect(0, 0, live.width, live.height);

function onSample(values) {
  const s = SOURCES[srcSelect.value];
  $('valLcd').textContent = s.channels.map((c, i) => `${c} ${Number(values[i]).toPrecision(5)}`).join('  ').toUpperCase();
  if (!engine || engine.state === State.IDLE) return;
  for (let i = 0; i < payloadF32.length; i++) payloadF32[i] = values[i] ?? 0;
  engine.ingest(now(), payload);
  lctx.drawImage(live, -1, 0);
  lctx.fillStyle = '#0b0d0b'; lctx.fillRect(live.width - 1, 0, 1, live.height);
  const norm = 1 / (1 + Math.exp(-values[0] / 200));
  lctx.fillStyle = engine.state === State.ACTIVE_RECORDING ? '#fb6597' : '#65fbd2';
  lctx.fillRect(live.width - 1, live.height - norm * live.height, 1, 3);
}

const fail = (e) => { $('errLcd').textContent = `ERR ${e.message}`.toUpperCase(); };

wireTransport({
  arm: $('armBtn'), trig: $('trigBtn'), stop: $('stopBtn'), errLcd: $('errLcd'),
  onArm: async () => {
    source = SOURCES[srcSelect.value];
    srcSelect.disabled = true;
    payload = new Uint8Array(source.channels.length * 4);
    payloadF32 = new Float32Array(payload.buffer);
    sink.frames.length = 0;
    $('csvBtn').disabled = true;
    engine = new RetroCaptureEngine({
      frameRate: source.rate, prerollSeconds: source.preroll,
      slotBytes: payload.length, sink,
      onWarn: (code, d) => console.warn('[retrocache]', code, d),
    });
    try {
      await source.start(onSample, fail);
    } catch (e) {
      srcSelect.disabled = false;
      throw e;
    }
    engine.arm();
  },
  onTrig: () => engine.trigger(),
  onStop: async () => {
    await engine.stop();
    source.stop();
    srcSelect.disabled = false;
    plotFrames($('plotView'), sink.frames, source.channels.map((label, index) => ({ label, index })));
    $('csvBtn').disabled = sink.frames.length === 0;
    if (sink.frames.length) {
      const span = (sink.frames.at(-1).meta.timestampUs - sink.frames[0].meta.timestampUs) / 1e6;
      $('takeLcd').textContent = span.toFixed(2);
      $('preLcd').textContent = sink.frames.filter((f) => f.meta.origin === 'cache').length;
    } else {
      $('takeLcd').textContent = '--'; $('preLcd').textContent = '--';
      $('errLcd').textContent = 'NO SAMPLES';
    }
  },
});
$('csvBtn').onclick = () => download(`rc4-${srcSelect.value}.csv`,
  new Blob([framesToCSV(sink.frames, source.channels)], { type: 'text/csv' }));
</script>
</body>
</html>
