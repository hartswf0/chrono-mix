<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<link rel="icon" href="data:," />
<title>Retro Cache — Microphone</title>
<link rel="stylesheet" href="demo.css" />
</head>
<body>
<div class="app">
  <section class="panel">
    <div class="row spread">
      <h1>RETRO CACHE · MICROPHONE</h1>
      <span class="state" id="stateBadge">IDLE</span>
    </div>
    <canvas id="liveView" class="cv" width="480" height="140"></canvas>
    <div class="row">
      <button class="btn arm" id="armBtn">ARM CACHE</button>
      <button class="btn hot" id="trigBtn" disabled>TRIGGER</button>
      <button class="btn" id="stopBtn" disabled>STOP</button>
    </div>
    <div class="tiny" id="statsLine">—</div>
    <div class="tiny" id="msgLine">
      Live microphone PCM in ~43 ms chunks, 10 s pre-roll ring. Someone says
      the thing, <em>then</em> you hit TRIGGER — the last 10 s are recovered
      and live audio appends behind them. <a href="index.html">← all sensors</a>
    </div>
  </section>
  <section class="panel">
    <div class="legend">
      <span><span class="chip" style="background:var(--accent)"></span>cache (pre-roll)</span>
      <span><span class="chip" style="background:var(--hot)"></span>live (after trigger)</span>
    </div>
    <canvas id="waveView" class="cv" width="480" height="140"></canvas>
    <div class="row">
      <button class="btn" id="playBtn" disabled>PLAY</button>
      <button class="btn" id="wavBtn" disabled>DOWNLOAD WAV</button>
    </div>
    <div class="tiny" id="outLine">Persisted audio appears here after STOP.</div>
  </section>
</div>

<script type="module">
import { RetroCaptureEngine, MemorySink, State } from './retrocache.js';
import { makeTimestamper, wireStatus, encodeWav, download } from './demo-ui.js';

const CHUNK = 2048, PREROLL_S = 10;

const live = document.getElementById('liveView'); const lctx = live.getContext('2d');
const wave = document.getElementById('waveView'); const wctx = wave.getContext('2d');
const armBtn = document.getElementById('armBtn');
const trigBtn = document.getElementById('trigBtn');
const stopBtn = document.getElementById('stopBtn');
const playBtn = document.getElementById('playBtn');
const wavBtn = document.getElementById('wavBtn');
const msgLine = document.getElementById('msgLine');
const outLine = document.getElementById('outLine');

let audioCtx = null, engine = null;
const sink = new MemorySink();
wireStatus(() => engine, document.getElementById('stateBadge'), document.getElementById('statsLine'));

const now = makeTimestamper();
const payload = new Uint8Array(CHUNK * 2);
const payloadI16 = new Int16Array(payload.buffer);

lctx.fillStyle = '#000'; lctx.fillRect(0, 0, live.width, live.height);

function drawLiveChunk(f32) {
  // Rolling waveform: shift left, paint the new chunk as one column pair.
  lctx.drawImage(live, -2, 0);
  lctx.fillStyle = '#000'; lctx.fillRect(live.width - 2, 0, 2, live.height);
  let lo = 1, hi = -1;
  for (let i = 0; i < f32.length; i++) { const v = f32[i]; if (v < lo) lo = v; if (v > hi) hi = v; }
  const mid = live.height / 2;
  lctx.fillStyle = engine && engine.state === State.ACTIVE_RECORDING ? '#fb6597' : '#65fbd2';
  lctx.fillRect(live.width - 2, mid - hi * mid, 2, Math.max(1, (hi - lo) * mid));
}

async function ensureAudio() {
  if (audioCtx) { await audioCtx.resume(); return; }
  const stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  await audioCtx.resume();
  const rate = audioCtx.sampleRate / CHUNK; // ≈23.4 fps at 48 kHz
  engine = new RetroCaptureEngine({
    frameRate: rate, prerollSeconds: PREROLL_S, slotBytes: CHUNK * 2, sink,
    onWarn: (code, d) => console.warn('[retrocache]', code, d),
  });
  const src = audioCtx.createMediaStreamSource(stream);
  // ScriptProcessor keeps this demo dependency-free and main-thread simple;
  // a production build would move ingest into an AudioWorklet.
  const proc = audioCtx.createScriptProcessor(CHUNK, 1, 1);
  proc.onaudioprocess = (e) => {
    const f32 = e.inputBuffer.getChannelData(0);
    drawLiveChunk(f32);
    if (engine.state === State.IDLE) return;
    for (let i = 0; i < CHUNK; i++) {
      const s = Math.max(-1, Math.min(1, f32[i]));
      payloadI16[i] = s < 0 ? s * 0x8000 : s * 0x7fff;
    }
    engine.ingest(now(), payload);
  };
  src.connect(proc);
  proc.connect(audioCtx.destination); // required for processing; silent output
}

function persistedSamples() {
  const out = new Float32Array(sink.frames.length * CHUNK);
  sink.frames.forEach((f, i) => {
    const i16 = new Int16Array(f.bytes.buffer, f.bytes.byteOffset, CHUNK);
    for (let j = 0; j < CHUNK; j++) out[i * CHUNK + j] = i16[j] / 0x8000;
  });
  return out;
}

function drawPersisted() {
  const frames = sink.frames;
  wctx.fillStyle = '#000'; wctx.fillRect(0, 0, wave.width, wave.height);
  if (!frames.length) return;
  const mid = wave.height / 2;
  const pxPerFrame = wave.width / frames.length;
  frames.forEach((f, i) => {
    const i16 = new Int16Array(f.bytes.buffer, f.bytes.byteOffset, CHUNK);
    let lo = 0, hi = 0;
    for (let j = 0; j < CHUNK; j++) { const v = i16[j]; if (v < lo) lo = v; if (v > hi) hi = v; }
    wctx.fillStyle = f.meta.origin === 'cache' ? '#65fbd2' : '#fb6597';
    const x = i * pxPerFrame;
    wctx.fillRect(x, mid - (hi / 0x8000) * mid, Math.max(1, pxPerFrame), Math.max(1, ((hi - lo) / 0x8000) * mid));
    if (f.meta.gapBefore) { wctx.fillStyle = '#ff3b3b'; wctx.fillRect(x, 0, 2, 10); }
  });
  const b = frames.findIndex((f) => f.meta.origin === 'live');
  if (b > 0) {
    wctx.strokeStyle = '#fb6597'; wctx.setLineDash([4, 4]);
    wctx.beginPath(); wctx.moveTo(b * pxPerFrame, 0); wctx.lineTo(b * pxPerFrame, wave.height); wctx.stroke();
    wctx.setLineDash([]);
  }
  const secs = (frames.length * CHUNK) / audioCtx.sampleRate;
  const cache = b < 0 ? frames.length : b;
  outLine.textContent =
    `${secs.toFixed(2)}s persisted · ${(cache * CHUNK / audioCtx.sampleRate).toFixed(2)}s recovered retroactively · ` +
    `ids ${frames[0].meta.frameId}…${frames[frames.length - 1].meta.frameId}`;
}

armBtn.onclick = async () => {
  armBtn.disabled = true;
  try {
    await ensureAudio();
    sink.frames.length = 0;
    engine.arm();
    trigBtn.disabled = false; stopBtn.disabled = true;
    playBtn.disabled = true; wavBtn.disabled = true;
  } catch (e) {
    msgLine.innerHTML = `<span class="err">microphone unavailable: ${e.message}</span>`;
    armBtn.disabled = false;
  }
};
trigBtn.onclick = () => { engine.trigger(); trigBtn.disabled = true; stopBtn.disabled = false; };
stopBtn.onclick = async () => {
  stopBtn.disabled = true;
  await engine.stop();
  armBtn.disabled = false;
  drawPersisted();
  playBtn.disabled = wavBtn.disabled = sink.frames.length === 0;
};
playBtn.onclick = () => {
  const samples = persistedSamples();
  const buf = audioCtx.createBuffer(1, samples.length, audioCtx.sampleRate);
  buf.copyToChannel(samples, 0);
  const node = audioCtx.createBufferSource();
  node.buffer = buf; node.connect(audioCtx.destination); node.start();
};
wavBtn.onclick = () => download('retrocache.wav', encodeWav(persistedSamples(), audioCtx.sampleRate));
</script>
</body>
</html>
