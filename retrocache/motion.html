<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<link rel="icon" href="data:," />
<title>RC-3 IMU</title>
<link rel="stylesheet" href="instrument.css" />
</head>
<body>
<div class="device">
  <section class="mod">
    <div class="head">
      <div>
        <div class="brand">RETRO CACHE</div>
        <a class="model" href="index.html">RC-3 · IMU · 60 HZ · 15 S PRE-ROLL</a>
      </div>
      <div class="leds">
        <span class="led" id="stbyLed"><i></i>STBY</span>
        <span class="led rec" id="recLed"><i></i>REC</span>
      </div>
    </div>
    <canvas id="liveView" class="screen" width="480" height="130"></canvas>
    <div class="bars">
      <div class="bar"><span>RING</span><canvas id="ringBar" width="240" height="12"></canvas></div>
      <div class="bar"><span>QUEUE</span><canvas id="queueBar" width="240" height="12"></canvas></div>
    </div>
    <div class="lcds">
      <div class="lcd"><label>LOOK S</label><b id="lookLcd">0.0</b></div>
      <div class="lcd"><label>|A| M/S²</label><b id="magLcd">--</b></div>
      <div class="lcd"><label>PERS</label><b id="persLcd">0</b></div>
      <div class="lcd"><label>DROP</label><b id="dropLcd">0</b></div>
      <div class="lcd wide"><label>STATUS</label><b id="errLcd">READY</b></div>
    </div>
    <div class="keys">
      <button class="key armk" id="armBtn">ARM</button>
      <button class="key trig" id="trigBtn" disabled>TRIG</button>
      <button class="key" id="stopBtn" disabled>STOP</button>
      <button class="key small tog" id="synBtn">SYN</button>
    </div>
  </section>

  <section class="mod">
    <canvas id="plotView" class="screen" width="480" height="336"></canvas>
    <div class="row">
      <button class="key small" id="csvBtn" disabled>CSV</button>
      <div class="lcd" style="flex:1"><label>TAKE S</label><b id="takeLcd">--</b></div>
      <div class="lcd" style="flex:1"><label>PRE N</label><b id="preLcd">--</b></div>
    </div>
    <div class="legend">
      <span><span class="chip" style="background:var(--cache)"></span>CACHE</span>
      <span><span class="chip" style="background:var(--live)"></span>LIVE</span>
      <span><span class="chip" style="background:#ff3b3b"></span>GAP</span>
    </div>
  </section>
</div>

<script type="module">
import { RetroCaptureEngine, MemorySink, State } from './retrocache.js';
import { makeTimestamper, plotFrames, framesToCSV, download } from './demo-ui.js';
import { wirePanel, wireTransport } from './instrument.js';

const RATE = 60, PREROLL_S = 15;
const CHANNELS = ['acc_x','acc_y','acc_z','accg_x','accg_y','accg_z','rot_a','rot_b','rot_g','ori_a','ori_b','ori_g'];
const $ = (id) => document.getElementById(id);

const live = $('liveView'); const lctx = live.getContext('2d');

const sink = new MemorySink();
const engine = new RetroCaptureEngine({
  frameRate: RATE, prerollSeconds: PREROLL_S, slotBytes: CHANNELS.length * 4, sink,
  onWarn: (code, d) => console.warn('[retrocache]', code, d),
});

const now = makeTimestamper();
const payload = new Uint8Array(CHANNELS.length * 4);
const payloadF32 = new Float32Array(payload.buffer);
const orientation = [0, 0, 0];
let sawRealEvent = false, lastMag = 0;

lctx.fillStyle = '#0b0d0b'; lctx.fillRect(0, 0, live.width, live.height);

wirePanel(() => engine, {
  stbyLed: $('stbyLed'), recLed: $('recLed'),
  lookLcd: $('lookLcd'), persLcd: $('persLcd'), dropLcd: $('dropLcd'),
  ringBar: $('ringBar'), queueBar: $('queueBar'),
  extra: () => { $('magLcd').textContent = lastMag ? lastMag.toFixed(1) : '--'; },
});

function record(acc, accG, rot) {
  payloadF32[0] = acc[0]; payloadF32[1] = acc[1]; payloadF32[2] = acc[2];
  payloadF32[3] = accG[0]; payloadF32[4] = accG[1]; payloadF32[5] = accG[2];
  payloadF32[6] = rot[0]; payloadF32[7] = rot[1]; payloadF32[8] = rot[2];
  payloadF32[9] = orientation[0]; payloadF32[10] = orientation[1]; payloadF32[11] = orientation[2];
  if (engine.state !== State.IDLE) engine.ingest(now(), payload);

  const aMag = Math.hypot(acc[0], acc[1], acc[2]);
  const rMag = Math.hypot(rot[0], rot[1], rot[2]);
  lastMag = aMag;
  lctx.drawImage(live, -1, 0);
  lctx.fillStyle = '#0b0d0b'; lctx.fillRect(live.width - 1, 0, 1, live.height);
  const h = live.height;
  lctx.fillStyle = '#39424f';
  lctx.fillRect(live.width - 1, h - Math.min(h, (rMag / 400) * h), 1, 3);
  lctx.fillStyle = engine.state === State.ACTIVE_RECORDING ? '#fb6597' : '#65fbd2';
  lctx.fillRect(live.width - 1, h - Math.min(h, (aMag / 25) * h), 1, 3);
}

window.addEventListener('deviceorientation', (e) => {
  orientation[0] = e.alpha ?? 0; orientation[1] = e.beta ?? 0; orientation[2] = e.gamma ?? 0;
});
window.addEventListener('devicemotion', (e) => {
  if (synthOn) return;
  sawRealEvent = true;
  const a = e.acceleration ?? {}, g = e.accelerationIncludingGravity ?? {}, r = e.rotationRate ?? {};
  record([a.x ?? 0, a.y ?? 0, a.z ?? 0], [g.x ?? 0, g.y ?? 0, g.z ?? 0], [r.alpha ?? 0, r.beta ?? 0, r.gamma ?? 0]);
});

// SYN key: synthetic source so the device works without an IMU.
let synthOn = false, synthTimer = null, synthT = 0;
$('synBtn').onclick = () => {
  synthOn = !synthOn;
  $('synBtn').classList.toggle('on', synthOn);
  if (synthOn && !synthTimer) {
    synthTimer = setInterval(() => {
      synthT += 1 / RATE;
      const burst = Math.sin(synthT / 3) > 0.8 ? 6 : 0.4;
      const acc = [
        Math.sin(synthT * 9) * burst + (Math.random() - 0.5),
        Math.cos(synthT * 7) * burst + (Math.random() - 0.5),
        Math.sin(synthT * 5) * burst * 0.5,
      ];
      orientation[0] = (synthT * 20) % 360; orientation[1] = Math.sin(synthT) * 40; orientation[2] = Math.cos(synthT) * 30;
      record(acc, [acc[0], acc[1], acc[2] + 9.81], [Math.cos(synthT * 8) * burst * 30, Math.sin(synthT * 6) * burst * 30, 0]);
    }, 1000 / RATE);
  } else if (!synthOn && synthTimer) {
    clearInterval(synthTimer); synthTimer = null;
  }
};

wireTransport({
  arm: $('armBtn'), trig: $('trigBtn'), stop: $('stopBtn'), errLcd: $('errLcd'),
  onArm: async () => {
    if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function' && !synthOn) {
      const ok = await DeviceMotionEvent.requestPermission();
      if (ok !== 'granted') throw new Error('MOTION DENIED');
      if (typeof DeviceOrientationEvent?.requestPermission === 'function') {
        await DeviceOrientationEvent.requestPermission().catch(() => {});
      }
    }
    sink.frames.length = 0;
    $('csvBtn').disabled = true;
    engine.arm();
    if (!synthOn) {
      setTimeout(() => {
        if (!sawRealEvent && engine.state !== State.IDLE) {
          $('errLcd').textContent = 'NO IMU — USE SYN';
        }
      }, 1500);
    }
  },
  onTrig: () => engine.trigger(),
  onStop: async () => {
    await engine.stop();
    plotFrames($('plotView'), sink.frames, [
      { label: 'acc_x m/s²', index: 0 }, { label: 'acc_y m/s²', index: 1 }, { label: 'acc_z m/s²', index: 2 },
      { label: 'rot_α °/s', index: 6 }, { label: 'rot_β °/s', index: 7 }, { label: 'rot_γ °/s', index: 8 },
    ]);
    $('csvBtn').disabled = sink.frames.length === 0;
    if (sink.frames.length) {
      const span = (sink.frames.at(-1).meta.timestampUs - sink.frames[0].meta.timestampUs) / 1e6;
      $('takeLcd').textContent = span.toFixed(2);
      $('preLcd').textContent = sink.frames.filter((f) => f.meta.origin === 'cache').length;
    }
  },
});
$('csvBtn').onclick = () => download('rc3-imu.csv', new Blob([framesToCSV(sink.frames, CHANNELS)], { type: 'text/csv' }));
</script>
</body>
</html>
